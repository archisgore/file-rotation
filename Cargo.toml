[package]
name = "file-rotation"
version = "0.4.3"
authors = ["Kevin Robert Stravers <macocio@gmail.com>", "Archis Gore <me@archisgore.com>"]
edition = "2018"
description = "Log rotation for files, supports synchronous std API and an asynchronous tokio-based API."
homepage = "https://github.com/archisgore/file-rotation"
repository = "https://github.com/archisgore/file-rotation"
keywords = ["log", "rotate", "logrotate"]
license = "MIT"
readme = "README.md"

[features]
default = ["async"]
async = ["futures", "futures-util", "tokio"]
sync = []

[dependencies]
futures = { version = "0.3.34", optional = true }
futures-util = { version = "0.3.34", optional = true }
tokio = { version = "1.54.1", features = ["fs", "io-util"], optional = true }

[dev-dependencies]
quickcheck = "1.1.0"
quickcheck_macros = "1.2.0"
tokio = { version = "1.54.1", features = ["rt", "fs", "io-util", "macros"]}
tokio-test = "0.4.6"

[package.metadata.cargo-all-features]
skip_optional_dependencies = true

